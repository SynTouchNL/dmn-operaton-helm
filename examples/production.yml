server:
# https://docs.operaton.org/manual/latest/user-guide/operaton-bpm-run/#https
# do not use the provided certificate in production
##  ssl:
##    key-store: classpath:keystore.p12
##    key-store-password: operaton
##    key-store-type: pkcs12
##    key-alias: localhost
##    key-password: operaton
##  port: 8443

# https://docs.operaton.org/manual/latest/user-guide/security/#http-header-security-in-webapps
# https://docs.operaton.org/manual/latest/webapps/shared-options/header-security/
  servlet.session.cookie:
    secure: true
    http-only: true

# https://docs.operaton.org/manual/latest/user-guide/operaton-bpm-run/#logging
# https://docs.operaton.org/manual/latest/user-guide/logging/#process-engine
logging:
   level.root: INFO
   file.name: logs/operaton-bpm-run.log

# datasource configuration is required
# do not use the H2 databse in production
# https://docs.operaton.org/manual/latest/user-guide/operaton-bpm-run/#connect-to-a-database
# https://docs.operaton.org/manual/latest/user-guide/operaton-bpm-run/#database
spring.datasource:
##  url: jdbc:h2:./operaton-h2-test-production/process-engine;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE
  url: ${DB_URL}
  driver-class-name: org.postgresql.Driver
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}

# By default, Spring Boot serves static content from any directories called /static or /public or /resources or
# /META-INF/resources in the classpath. To prevent users from accidentally sharing files, this is disabled here by setting static locations to NULL.
# https://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/#boot-features-spring-mvc-static-content
spring.web.resources:
  static-locations: NULL
  

# Operaton Keycloak Identity Provider Plugin
# Externalized Keycloak configuration
keycloak:
  # Keycloak access for the Identity Provider plugin.
  host: ${OPERATON_KEYCLOAK_HOST}
  realm: ${OPERATON_KEYCLOAK_REALM:zgw-ad}
  # Keycloak Operaton Identity Client
  client.id: ${OPERATON_KEYCLOAK_CLIENT_ID}
  client.secret: ${OPERATON_KEYCLOAK_CLIENT_SECRET}

plugin.identity.keycloak:
  keycloakIssuerUrl: ${keycloak.host}/auth/realms/${keycloak.realm}
  keycloakAdminUrl: ${keycloak.host}/auth/admin/realms/${keycloak.realm}
  clientId: ${keycloak.client.id}
  clientSecret: ${keycloak.client.secret}
  useEmailAsOperatonUserId: false
  administratorGroupName: operaton-admin
  useUsernameAsOperatonUserId: true
  useGroupPathAsOperatonGroupId: true
  disableSSLCertificateValidation: false

# Spring Boot Security OAuth2 SSO
spring.security.oauth2:
  client:
    registration:
      keycloak:
        provider: keycloak
        client-id: ${keycloak.client.id}
        client-secret: ${keycloak.client.secret}
        authorization-grant-type: authorization_code
        redirect-uri: "${OPERATON_HOST_URL}/{action}/oauth2/code/{registrationId}"
        scope: openid, profile, email
    provider:
      keycloak:
        issuer-uri: ${keycloak.host}/realms/${keycloak.realm}
        authorization-uri: ${keycloak.host}/realms/${keycloak.realm}/protocol/openid-connect/auth
        user-info-uri: ${keycloak.host}/realms/${keycloak.realm}/protocol/openid-connect/userinfo
        token-uri: ${keycloak.host}/realms/${keycloak.realm}/protocol/openid-connect/token
        jwk-set-uri: ${keycloak.host}/realms/${keycloak.realm}/protocol/openid-connect/certs
        # set user-name-attribute one of: 
        # - sub                -> default; using keycloak ID as Operaton user ID
        # - email              -> useEmailAsOperatonUserId=true
        # - preferred_username -> useUsernameAsOperatonUserId=true
        user-name-attribute: preferred_username
